[project]
name = "talentai_crew"
version = "1.0.0"
description = "TalentAI : présélection RH multi-agents (CrewAI + outils LangChain + ChatGPT) — l'IA recommande, l'humain décide"
authors = [{ name = "Badre El Mouden" }]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.10",
    "langchain-community>=0.4",
    "langchain-core>=1.0",
    "pypdf>=5.0",
    "docx2txt>=0.8",
    "python-dotenv>=1.0",
]

[project.scripts]
talentai_crew = "talentai_crew.main:run"
run_crew = "talentai_crew.main:run"
train = "talentai_crew.main:train"
replay = "talentai_crew.main:replay"
test = "talentai_crew.main:test"
run_with_trigger = "talentai_crew.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talentai_crew"]

[tool.crewai]
type = "crew"
project_id = "9279809e-c66b-40a7-ba58-85d591b22622"
